<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#E53935" />
  <meta name="description" content="JKT48 Live Radar - Pantau siaran live member JKT48 di IDN Live dan SHOWROOM secara real-time." />
  
  <title>JKT48 Live Radar</title>

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Stylesheets with cache busting -->
  <link rel="stylesheet" href="src/styles/main.css?v=20240918" />
  <link rel="stylesheet" href="src/styles/components.css?v=20240918" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

  <style>
    /* Instant Anti-Flash Loading Placeholder */
    .app-initial-loader {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .app-initial-loader img {
      height: 64px;
      margin-bottom: 16px;
      animation: pulseLogo 1.5s ease-in-out infinite;
    }
    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="app-root">
    <div class="app-initial-loader">
      <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/JKT48.svg" alt="JKT48" />
      <div style="width: 140px; height: 3px; background: #f0f0f0; border-radius: 3px; overflow: hidden;">
        <div style="width: 40%; height: 100%; background: #E53935; border-radius: 3px; animation: loadBar 1.2s infinite ease-in-out;"></div>
      </div>
      <span style="font-size: 11px; color: #888; margin-top: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;">Memuat Radar JKT48...</span>
    </div>
  </div>

  <style>
    @keyframes loadBar {
      0% { transform: translateX(-100%); width: 30%; }
      50% { width: 70%; }
      100% { transform: translateX(350%); width: 30%; }
    }
  </style>

  <!-- Universal Application Bundle with cache busting -->
  <script src="bundle.js?v=20240918_2"></script>

  <!-- Service Worker Registration -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./firebase-messaging-sw.js")
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
