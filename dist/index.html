<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#E53935" />
  <meta name="description" content="JKT48 Live Radar — Pantau live member JKT48 di IDN Live dan SHOWROOM secara real-time." />
  
  <title>JKT48 Live Radar</title>

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="src/styles/main.css" />
  <link rel="stylesheet" href="src/styles/components.css" />

  <!-- Preconnect to image CDNs -->
  <link rel="preconnect" href="https://upload.wikimedia.org" />
</head>
<body>
  <div id="app-root">
    <!-- App mounts here via router.js -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #FFFFFF;">
      <div style="text-align: center;">
        <span class="pulse-dot" style="width: 14px; height: 14px; margin: 0 auto 12px; display: block;"></span>
        <div style="font-weight: 700; font-size: 0.95rem; color: #202124;">Memuat JKT48 Live Radar...</div>
      </div>
    </div>
  </div>

  <!-- Register Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./firebase-messaging-sw.js")
          .then((reg) => console.log("[PWA] Service Worker registered:", reg.scope))
          .catch((err) => console.warn("[PWA] Service Worker registration failed:", err));
      });
    }
  </script>

  <!-- Router & Application Core -->
  <script type="module" src="src/app/router.js"></script>
</body>
</html>
